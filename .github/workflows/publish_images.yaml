name: Publish uService images

# Builds the powertrain uService images and pushes them to THIS fork's GHCR
# namespace (the upstream eclipse-sdv-blueprints images are private and not
# anonymously pullable). Images are tagged by a content hash of their build
# inputs, so the authorization-tests workflow can pull a prebuilt image instead
# of rebuilding from source whenever the uService sources are unchanged.
#
# Runs on base-branch pushes so the registry stays warm; the test workflow
# self-seeds (builds + pushes on a cache miss) if this has not run yet.

on:
  push:
    branches:
      - main
      - hackathon
    paths:
      - uservices/**
      - ecu-sim/**
      - docker-compose.yaml
      - .github/workflows/publish_images.yaml
  workflow_dispatch:

concurrency:
  group: publish-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Resolve registry and image tag
        # GHCR names must be lowercase; the content hash keys images on their
        # build inputs so an unchanged source tree reuses the same tag.
        run: |
          echo "REGISTRY=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=${{ hashFiles('uservices/**', 'ecu-sim/**', 'docker-compose.yaml') }}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        run: echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin

      - name: Set up Docker buildx (container driver)
        run: |
          docker buildx create --name ci-builder --driver docker-container --use
          docker buildx inspect --bootstrap

      - name: Restore Docker build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/.buildx-cache
          key: buildx-${{ runner.os }}-${{ hashFiles('uservices/**/Cargo.toml', 'uservices/**/Cargo.lock', 'uservices/**/Dockerfile', 'ecu-sim/**/*.gradle*', 'ecu-sim/docker/Dockerfile') }}
          restore-keys: |
            buildx-${{ runner.os }}-

      - name: Build and push images
        env:
          # The local cache lives in /tmp, outside the build context.
          BUILDX_BAKE_ENTITLEMENTS_FS: "0"
        run: |
          docker buildx bake \
            --file docker-compose.yaml \
            --set "*.cache-from=type=local,src=/tmp/.buildx-cache" \
            --set "*.cache-to=type=local,dest=/tmp/.buildx-cache-new,mode=max" \
            --set "fms.tags=${REGISTRY}/fms:${IMAGE_TAG}" \
            --set "vehicle-properties.tags=${REGISTRY}/vehicle-properties:${IMAGE_TAG}" \
            --set "powertrain-mode-controller.tags=${REGISTRY}/powertrain-mode-controller:${IMAGE_TAG}" \
            --set "sovd-cda.tags=${REGISTRY}/sovd-cda:${IMAGE_TAG}" \
            --set "ecu-sim.tags=${REGISTRY}/ecu-sim:${IMAGE_TAG}" \
            --push \
            fms vehicle-properties powertrain-mode-controller sovd-cda ecu-sim

      - name: Rotate build cache
        if: always()
        run: |
          rm -rf /tmp/.buildx-cache
          if [ -d /tmp/.buildx-cache-new ]; then mv /tmp/.buildx-cache-new /tmp/.buildx-cache; fi

      - name: Summary
        if: always()
        run: |
          {
            echo "## Published uService images"
            echo ""
            echo "Registry: \`${REGISTRY}\`"
            echo "Tag: \`${IMAGE_TAG}\` (content hash of uservices/ecu-sim/compose)"
          } >> "$GITHUB_STEP_SUMMARY"
