name: Unit tests

# Runs the uServices' Rust unit tests via cargo. These are pure unit tests that
# need no running stack (e.g. the powertrain Rego authorization policy). The
# live-stack SPIFFE/JWT authorization matrix is covered separately by
# authorization_tests.yaml.

on:
  push:
    branches:
      - main
      - hackathon
  pull_request:
    branches:
      - main
      - hackathon

env:
  RUST_TOOLCHAIN: ${{ vars.RUST_TOOLCHAIN || 'stable' }}
  CARGO_TERM_COLOR: always

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          cache-workspaces: uservices
      - name: Run uServices unit tests
        # Exclude `cda`: it is a thin wrapper over the external OpenSOVD CDA
        # (an expensive git/C build), has no unit tests of its own, and its
        # behaviour is exercised by authorization_tests.yaml. Excluding it keeps
        # this workflow fast while still running every other crate's unit tests.
        run: cargo test --manifest-path uservices/Cargo.toml --workspace --exclude cda
