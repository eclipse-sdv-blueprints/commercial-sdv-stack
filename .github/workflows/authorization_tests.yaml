name: Authorization integration tests

# Brings up the infra + powertrain Compose stack, registers the SPIRE workloads,
# then runs the full SPIFFE/JWT authorization matrix (tests/) against the live
# CDA SOVD API, INCLUDING the stateful #[ignore]d offline tests (which stop/start
# spire-server and launch a rogue container).
#
# The custom uService images are private upstream, so they are built once and
# pushed to this fork's GHCR namespace by publish_images.yaml and tagged by a
# content hash of their build inputs. This job pulls that prebuilt image when the
# uService sources are unchanged (fast path) and only builds + pushes on a cache
# miss (e.g. a uService source change), so test-only / config-only PRs skip the
# ~20-min build entirely.

on:
  push:
    branches:
      - main
      - hackathon
  pull_request:
    branches:
      - main
      - hackathon
  workflow_dispatch:

# Only the latest run per ref needs to finish; cancel superseded ones.
concurrency:
  group: authz-tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: ${{ vars.RUST_TOOLCHAIN || 'stable' }}
  CARGO_TERM_COLOR: always

jobs:
  authorization-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Needed only on a cache miss, when this job builds and pushes the images
      # itself (self-seeding). The fast path only reads packages.
      packages: write
    # Fast path (images already in GHCR): pull + stack up + tests ~= 8-10 min.
    # Cache-miss path builds the images first (~13-24 min). Sized for the latter.
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          # Cache keyed on the tests/ crate.
          cache-workspaces: tests

      - name: Show Docker / Compose versions
        run: |
          docker --version
          docker compose version

      - name: Resolve registry and image tag
        # GHCR names must be lowercase; the content hash keys images on their
        # build inputs (must match publish_images.yaml exactly).
        run: |
          echo "REGISTRY=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=${{ hashFiles('uservices/**', 'ecu-sim/**', 'docker-compose.yaml') }}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        run: echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin

      - name: Set up Docker buildx (container driver)
        # Only exercised on a cache miss, when this job builds the images itself.
        run: |
          docker buildx create --name ci-builder --driver docker-container --use
          docker buildx inspect --bootstrap

      - name: Restore Docker build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/.buildx-cache
          key: buildx-${{ runner.os }}-${{ hashFiles('uservices/**/Cargo.toml', 'uservices/**/Cargo.lock', 'uservices/**/Dockerfile', 'ecu-sim/**/*.gradle*', 'ecu-sim/docker/Dockerfile') }}
          restore-keys: |
            buildx-${{ runner.os }}-

      - name: Resolve uService images (pull, or build + push on miss)
        # Fast path: every image already exists in the fork registry at this
        # content tag -> just pull. Miss path: build + push them (self-seed), so
        # the next run with the same sources is fast. Either way the images are
        # retagged to the names docker-compose.yaml references, so the stack
        # comes up with --no-build.
        env:
          BUILDX_BAKE_ENTITLEMENTS_FS: "0"
        run: |
          set -euo pipefail
          services="fms vehicle-properties powertrain-mode-controller sovd-cda ecu-sim"
          need_build=0
          for s in $services; do
            if docker manifest inspect "${REGISTRY}/${s}:${IMAGE_TAG}" >/dev/null 2>&1; then
              echo "hit:  ${s}:${IMAGE_TAG}"
            else
              echo "miss: ${s}:${IMAGE_TAG}"
              need_build=1
            fi
          done

          if [ "$need_build" = "1" ]; then
            echo "::notice::Cache miss - building and pushing uService images"
            docker buildx bake \
              --file docker-compose.yaml \
              --set "*.cache-from=type=local,src=/tmp/.buildx-cache" \
              --set "*.cache-to=type=local,dest=/tmp/.buildx-cache-new,mode=max" \
              --set "fms.tags=${REGISTRY}/fms:${IMAGE_TAG}" \
              --set "vehicle-properties.tags=${REGISTRY}/vehicle-properties:${IMAGE_TAG}" \
              --set "powertrain-mode-controller.tags=${REGISTRY}/powertrain-mode-controller:${IMAGE_TAG}" \
              --set "sovd-cda.tags=${REGISTRY}/sovd-cda:${IMAGE_TAG}" \
              --set "ecu-sim.tags=${REGISTRY}/ecu-sim:${IMAGE_TAG}" \
              --push \
              $services
          else
            echo "::notice::Cache hit - pulling prebuilt uService images"
          fi

          # Pull each image and retag to the name docker-compose.yaml expects
          # (note sovd-cda's upstream image is named opensovd-cda).
          bp="ghcr.io/eclipse-sdv-blueprints/commercial-sdv-stack"
          retag() { docker pull "${REGISTRY}/$1:${IMAGE_TAG}"; docker tag "${REGISTRY}/$1:${IMAGE_TAG}" "$2:latest"; }
          retag fms                        "${bp}/fms"
          retag vehicle-properties         "${bp}/vehicle-properties"
          retag powertrain-mode-controller "${bp}/powertrain-mode-controller"
          retag sovd-cda                   "${bp}/opensovd-cda"
          retag ecu-sim                    "${bp}/ecu-sim"

          # Our private images are now local. Drop the GHCR credential: the rest
          # of the stack (spire, mosquitto, dozzle, databroker) is public, and an
          # authenticated cross-org pull of those 500s under this repo's token.
          docker logout ghcr.io

      - name: Rotate build cache
        if: always()
        run: |
          rm -rf /tmp/.buildx-cache
          if [ -d /tmp/.buildx-cache-new ]; then mv /tmp/.buildx-cache-new /tmp/.buildx-cache; fi

      - name: Start infra profile
        # Powertrain images are present locally (pulled/retagged above); public
        # infra images pull on demand. --no-build forbids a surprise rebuild.
        run: docker compose --profile infra up -d --no-build

      - name: Wait for spire-server to accept minting
        run: |
          echo "Waiting for spire-server to be ready to mint JWT-SVIDs..."
          for i in $(seq 1 60); do
            if docker compose exec -T spire-server \
                 /opt/spire/bin/spire-server healthcheck \
                 -socketPath /run/spire/server/private/api.sock >/dev/null 2>&1; then
              echo "spire-server is healthy (after ${i}s)."
              exit 0
            fi
            sleep 1
          done
          echo "::error::spire-server did not become healthy in time"
          docker compose logs spire-server
          exit 1

      - name: Register workloads with SPIRE
        run: scripts/register_workloads.sh

      - name: Start powertrain profile
        run: docker compose --profile infra --profile powertrain up -d --no-build

      - name: Wait for the CDA SOVD socket to be ready
        # The CDA is socket-hardened (no TCP listener); its Compose healthcheck
        # tests the SOVD Unix socket exists. Wait for that container to go
        # healthy before driving the matrix, so tests never run against a CDA
        # whose downstream (ecu-sim/DoIP) path has not come up yet.
        run: |
          cid="$(docker compose ps -q sovd-cda | head -1)"
          echo "Waiting for sovd-cda (${cid}) to report healthy..."
          for i in $(seq 1 120); do
            status="$(docker inspect -f '{{.State.Health.Status}}' "$cid" 2>/dev/null || echo unknown)"
            if [ "$status" = "healthy" ]; then
              echo "CDA is healthy (SOVD socket ready) after ${i}s."
              exit 0
            fi
            sleep 1
          done
          echo "::error::CDA did not become healthy in time (last status: ${status})"
          docker compose ps
          docker compose logs sovd-cda ecu-sim spire-agent-vehicle
          exit 1

      - name: Run authorization matrix (incl. ignored offline tests)
        env:
          STACK_DIR: ${{ github.workspace }}
        # --include-ignored runs the full matrix: the authorization checks plus
        # the stateful offline tests (rogue container, spire-server stop/start).
        # --test-threads=1 serializes them so the stack mutations don't overlap.
        # Expect ~2-3 min of test time (two ~70s expiry waits). tee the combined
        # output to a log the report step parses; pipefail keeps the step's exit
        # code tied to the test result rather than tee's.
        run: |
          set -o pipefail
          ./tests/run.sh --include-ignored --test-threads=1 --nocapture 2>&1 | tee authz-test-output.log

      - name: Publish test report
        # Render a report even when the tests fail, so the summary page shows
        # which checks passed/failed. Skipped if an earlier step bailed before
        # the tests ran (no log produced).
        if: always() && hashFiles('authz-test-output.log') != ''
        run: |
          log=authz-test-output.log
          {
            echo "## Authorization integration test report"
            echo ""
            echo "| Test | Result |"
            echo "| --- | --- |"
            grep -E '^test .+ \.\.\. (ok|FAILED|ignored)' "$log" | while read -r line; do
              name="$(printf '%s' "$line" | sed -E 's/^test (.+) \.\.\. (ok|FAILED|ignored).*/\1/')"
              res="$(printf '%s'  "$line" | sed -E 's/^test .+ \.\.\. (ok|FAILED|ignored).*/\1/')"
              case "$res" in
                ok)      icon="✅ pass" ;;
                FAILED)  icon="❌ fail" ;;
                ignored) icon="⏭️ ignored" ;;
                *)       icon="$res" ;;
              esac
              echo "| \`$name\` | $icon |"
            done || true
            echo ""
            # One "test result:" line per test binary (authorization, offline).
            summaries="$(grep -E '^test result:' "$log" || true)"
            if [ -n "$summaries" ]; then
              printf '%s\n' "$summaries" | while read -r r; do
                echo "- **${r#test result: }**"
              done
            else
              echo "_No libtest summary line found — see the step log for details._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Dump container logs on failure
        if: failure()
        run: |
          echo "===== docker compose ps ====="
          docker compose ps
          echo "===== sovd-cda ====="
          docker compose logs --no-color sovd-cda
          echo "===== spire-server ====="
          docker compose logs --no-color spire-server
          echo "===== spire-agent-vehicle ====="
          docker compose logs --no-color spire-agent-vehicle
          echo "===== ecu-sim ====="
          docker compose logs --no-color ecu-sim
          echo "===== powertrain-mode-controller ====="
          docker compose logs --no-color powertrain-mode-controller

      - name: Tear down the stack
        if: always()
        run: docker compose --profile infra --profile powertrain down -v
