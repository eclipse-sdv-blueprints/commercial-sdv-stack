[package]
name = "cda"
version = { workspace = true }
edition = { workspace = true }

[dependencies]
# opensovd cda dependencies
# AI-modified (GitHub Copilot, Claude Opus 5.5) - issue 7: begin
# hackathon fork of upstream; this revision includes the SOVD server Unix domain socket support
cda-database = { git = "https://github.com/Eclipse-SDV-Hackathon-Chapter-Four/classic-diagnostic-adapter.git", rev = "58f0c9044e2585d5dd264a980935c43d3c921250" }
cda-interfaces = { git = "https://github.com/Eclipse-SDV-Hackathon-Chapter-Four/classic-diagnostic-adapter.git", rev = "58f0c9044e2585d5dd264a980935c43d3c921250" }
cda-plugin-security = { git = "https://github.com/Eclipse-SDV-Hackathon-Chapter-Four/classic-diagnostic-adapter.git", rev = "58f0c9044e2585d5dd264a980935c43d3c921250" }
opensovd_cda_lib = { git = "https://github.com/Eclipse-SDV-Hackathon-Chapter-Four/classic-diagnostic-adapter.git", rev = "58f0c9044e2585d5dd264a980935c43d3c921250", package = "opensovd-cda" }
# AI-modified - issue 7: end

async-trait = { workspace = true }
axum = { version = "0.8.8", default-features = false }
axum-extra = { version = "0.12.5" }
clap = { workspace = true }
common = { workspace = true, features = ["opa"] }
futures = { version = "0.3.32" }
http = { version = "1.3.1" }
regorus = { workspace = true }
spiffe = { workspace = true, features = ["workload-api-jwt"] }
tokio = { workspace = true }
tracing = { workspace = true, features = ["log", "std"] }

