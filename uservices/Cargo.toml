[workspace]
members = [
    "common",
    "fms",
    "powertrain",
    "vehicle-properties",
]
resolver = "2"

[workspace.package]
readme = "README.md"
repository = "https://github.com/eclipse-sdv-blueprints/commercial-sdv-stack/"
edition = "2024"
publish = false

[workspace.dependencies]
async-trait = { version = "0.1.89" }
backon = { version = "1.6.0", default-features = false, features = ["tokio-sleep"] }
clap = { version = "4.6.1", default-features = false }
clap-num = { version = "1.2.0" }
common = { path = "common" }
env_logger = { version = "0.11.10", default-features = false, features = [
    "humantime",
] }
log = { version = "0.4.30" }
protobuf = { version = "3.7.2" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.150" }
tokio = { version = "1.53.1", default-features = false }
up-rust = { version = "0.9", default-features = false }
up-transport-mqtt5 = { version = "0.4" }
up-transport-zenoh = { version = "0.9.1" }
zenoh = { version = "1.10.1", default-features = false, features = ["auth_usrpwd", "transport_tcp", "transport_tls"] }

[profile.release]
lto = true          # Link time optimization (dead code removal etc...)
opt-level = "s"
codegen-units = 1
incremental = false
strip = true
