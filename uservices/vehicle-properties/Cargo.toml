[package]
name = "vehicle-properties"
publish = { workspace = true }
edition = { workspace = true }

[features]
default = ["mqtt5"]
mqtt5 = [ "common/mqtt5" ]
zenoh = [ "common/zenoh" ]

[dependencies]
async-trait = { workspace = true }
clap = { workspace = true, default-features = false, features = [
    "std",
    "derive",
    "env",
    "color",
    "help",
    "usage",
    "error-context",
    "suggestions",
] }
clap-num = { workspace = true }
common = { workspace = true }
env_logger = { workspace = true }
http = { version = "1.4.1" }
kuksa-rust-sdk = { version = "0.2.2" }
log = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["time"] }
up-rust = { workspace = true, default-features = false, features = ["communication"] }
